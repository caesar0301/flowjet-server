[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowjet-server"
version = "0.1.0"
description = "OpenAI-compatible HTTP service projecting agent runtimes onto the Responses API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "FlowJet" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "soothe-nano>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "openai>=2.51.0",
    "ruff>=0.12.0",
]

[project.scripts]
flowjet-server = "flowjet_server.__main__:main"

[project.urls]
Homepage = "https://github.com/mirasoth/flowjet-server"

[tool.hatch.build.targets.wheel]
packages = ["src/flowjet_server"]

[tool.hatch.build.targets.sdist]
include = ["src/flowjet_server/", "README.md", "docs/", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "openai>=2.51.0",
]
